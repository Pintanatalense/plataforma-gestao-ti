# =============================================================================
# Docker Compose — Plataforma de Gestão de TI (produção)
#
# Serviços:
#   - postgres: PostgreSQL 16 (NÃO publicado no host)
#   - backend:  API FastAPI (NÃO publicada no host; acessada pelo Nginx)
#   - worker:   worker de notificações e agenda (1 réplica; mesma imagem do backend)
#   - nginx:    única porta publicada; constrói e serve o frontend Angular
#
# Pré-requisito: copiar .env.example para .env e preencher POSTGRES_PASSWORD
# SECRET_KEY e APP_ENCRYPTION_KEY (o compose se recusa a subir sem eles).
#
# Uso:
#   docker compose up -d --build
#   docker compose logs -f backend
#
# Desenvolvimento (portas no localhost, código montado):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_ti}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-gestao_ti}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env (openssl rand -hex 32)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Defina APP_ENCRYPTION_KEY no .env (veja .env.example)}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Fortaleza}
      DEBUG: ${DEBUG:-false}
      ATTACHMENT_STORAGE_PATH: /data/attachments
      BACKUP_STORAGE_PATH: /data/backups
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
    volumes:
      - attachments_data:/data/attachments
      - backups_data:/data/backups
      - static_data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Worker de notificações: expande eventos em entregas, envia (in-app/e-mail), roda a agenda
  # (backup diário) e publica heartbeat. UMA réplica por desenho (ADR-013 §4.5).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-gestao_ti}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env (openssl rand -hex 32)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Defina APP_ENCRYPTION_KEY no .env (veja .env.example)}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Fortaleza}
      BACKUP_STORAGE_PATH: /data/backups
    volumes:
      - backups_data:/data/backups
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Evolution API (opcional, não oficial): docker compose --profile evolution up -d
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    profiles:
      - evolution
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8084}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-gestao_ti}?schema=evolution"
      LOG_LEVEL: "ERROR,WARN,INFO"
      DEL_INSTANCE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  attachments_data:
  backups_data:
  static_data:
  evolution_instances:
