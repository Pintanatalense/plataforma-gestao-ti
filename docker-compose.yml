# =============================================================================
# Docker Compose — Plataforma de Gestão de TI
#
# Serviços:
#   - postgres:  Banco de dados PostgreSQL 16
#   - backend:   API FastAPI
#   - nginx:     Proxy reverso + static files
#
# Uso:
#   docker-compose up -d          # Iniciar todos os serviços
#   docker-compose down           # Parar todos os serviços
#   docker-compose logs -f        # Ver logs em tempo real
#
# O frontend Angular é buildado localmente e copiado para o Nginx.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gestao-ti-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_ti}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestao-ti-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gestao_ti}
      SECRET_KEY: ${SECRET_KEY:-CHANGE-ME-IN-PRODUCTION}
      DEBUG: ${DEBUG:-false}
      ATTACHMENT_STORAGE_PATH: /data/attachments
      CORS_ORIGINS: '["http://localhost:4200", "http://localhost"]'
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - attachments_data:/data/attachments
      - backups_data:/data/backups
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Nginx — Proxy reverso
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gestao-ti-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend/dist/plataforma-gestao-ti/browser:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Evolution API v2 (Opcional — Iniciar com: docker compose --profile evolution up -d)
  # ---------------------------------------------------------------------------
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: gestao-ti-evolution
    profiles:
      - evolution
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8084}:8084"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8084}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-CHANGE-EVOLUTION-API-KEY-IN-PRODUCTION}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gestao_ti}?schema=evolution"
      LOG_LEVEL: "ERROR,WARN,INFO"
      DEL_INSTANCE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

# =============================================================================
# Volumes persistentes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  attachments_data:
    driver: local
  backups_data:
    driver: local
  evolution_instances:
    driver: local
