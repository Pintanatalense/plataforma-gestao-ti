# =============================================================================
# Nginx — Configuração do proxy reverso
#
# Roteamento:
#   /api/*   → Backend FastAPI (porta 8000)
#   /api/v1/notifications/ws → WebSocket (backend)
#   /static/* → arquivos públicos do backend (logomarca)
#   /*       → Frontend Angular (static files)
#
# Os blocos de roteamento ficam em app-locations.conf (compartilhado com o modo HTTPS).
# =============================================================================

# Limite de tentativas de login por IP (a conta já bloqueia após 5 senhas erradas; isto freia varredura
# de várias contas a partir de um mesmo endereço). Resposta 429 ao exceder.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=reset_limit:10m rate=30r/m;

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-locations.conf;
}
