# =============================================================================
# Nginx — Configuração do proxy reverso
#
# Roteamento:
#   /api/*   → Backend FastAPI (porta 8000)
#   /api/v1/notifications/ws → WebSocket (backend)
#   /static/* → arquivos públicos do backend (logomarca)
#   /*       → Frontend Angular (static files)
#
# Os blocos de roteamento ficam em app-locations.conf (compartilhado com o modo HTTPS).
# =============================================================================

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-locations.conf;
}
