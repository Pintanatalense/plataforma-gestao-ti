# =============================================================================
# Nginx — Configuração do proxy reverso
#
# Roteamento:
#   /api/*   → Backend FastAPI (porta 8000)
#   /ws/*    → Backend WebSocket (porta 8000)
#   /*       → Frontend Angular (static files)
# =============================================================================

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo de upload (100 MB para anexos)
    client_max_body_size 100m;

    # --- API Backend ---
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- WebSocket ---
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeout (mantém conexão aberta)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Frontend (Angular SPA) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — todas as rotas retornam index.html
        try_files $uri $uri/ /index.html;
    }

    # --- Headers de segurança ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
