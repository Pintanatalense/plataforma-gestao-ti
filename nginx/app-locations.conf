# =============================================================================
# Trechos compartilhados pelos modos HTTP (nginx.conf) e HTTPS (https.conf.template).
# Incluído dentro de um bloco `server`. Não editar de forma diferente nos dois modos.
# =============================================================================

# Tamanho máximo de upload (100 MB para anexos)
client_max_body_size 100m;

# --- API Backend ---
location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# --- WebSocket (notificações em tempo real) ---
location = /api/v1/notifications/ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Arquivos públicos do backend (logomarca) ---
location /static/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}

# --- Service worker do pop-up do navegador: nunca em cache, para atualizações chegarem na hora ---
location = /push-sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# --- Frontend (Angular SPA) ---
location / {
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — todas as rotas retornam index.html
    try_files $uri $uri/ /index.html;
}

# --- Headers de segurança ---
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Gzip ---
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml;
gzip_min_length 1000;
