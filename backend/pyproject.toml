[project]
name = "plataforma-gestao-ti"
version = "0.1.0"
description = "Plataforma Modular de Gestão de TI"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
    "pywebpush>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "pg: exige PostgreSQL descartável (TEST_DATABASE_URL)",
    "migrations: testa migrations Alembic em banco descartável (TEST_DATABASE_URL)",
    "legacy_behavior: fixa comportamento atual que será reescrito conscientemente em etapa futura",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Conjunto que apanha defeitos reais (import quebrado/morto, variável não usada, comparação errada,
# raise sem causa, redefinição). Regras de estilo (E501, I, UP, W, SIM, N) ficam de fora de propósito:
# ampliar depois, num PR só de formatação, para não misturar com mudança de comportamento.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]  # Depends() em argumento padrão é o idioma do FastAPI

[tool.ruff.lint.per-file-ignores]
# Importar por efeito colateral é intencional: registra os mapeadores do SQLAlchemy (relationship("Classe")
# resolve pelo nome) e o metadata. Remover esses imports quebra scripts que não passam por app.main.
"app/*/models.py" = ["F401"]
"app/seed.py" = ["F401"]
"app/seed_test.py" = ["F401"]
"app/check_registry.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
