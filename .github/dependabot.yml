# Atualizações automáticas de dependências (um PR por grupo, no máximo 5 abertos por ecossistema).
# Todo PR do Dependabot passa pelo mesmo CI e pela mesma revisão de qualquer outro (ver CONTRIBUTING.md).
version: 2
updates:
  # Backend: pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Fortaleza"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend: package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Fortaleza"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Imagens base dos Dockerfiles (backend, frontend/nginx)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Fortaleza"
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Fortaleza"
    commit-message:
      prefix: "chore(docker)"

  # Actions do CI (fixadas por SHA; o Dependabot atualiza o SHA e o comentário da versão)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Fortaleza"
    commit-message:
      prefix: "chore(ci)"
