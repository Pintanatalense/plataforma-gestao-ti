name: CI

# Minutos do GitHub Actions são limitados (2.000/mês no plano gratuito). Por isso:
#  - não há execução em "push" na main: o PR já rodou o mesmo código antes de ser mesclado;
#  - cada PR só roda os jobs das áreas que mudou (job `changes`); PR só de documentação roda só o `changes`;
#  - a suíte completa (inclusive SQLite e auditoria de dependências) roda toda segunda-feira e sob demanda.
on:
  pull_request:
    branches: [ "**" ]  # inclui PRs empilhados (base != main)
  schedule:
    - cron: "0 6 * * 1"  # segunda-feira, 06:00 UTC: tudo, na main
  workflow_dispatch:

# Princípio do menor privilégio: nenhum job precisa escrever no repositório.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior (main nunca é cancelada).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# As actions estão fixadas pelo SHA do commit (o comentário indica a versão); o Dependabot
# (.github/dependabot.yml) propõe a atualização do SHA e do comentário.
env:
  CI_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
  CI_ENCRYPTION_KEY: j7aZmoHBs-fLFKl4myK4N7BqySPuIpD8OjzqKQmxKtA=

jobs:
  # Decide o que rodar. Em PR compara o commit de merge com a base (HEAD^1); fora de PR (agenda, execução manual)
  # roda tudo. Mudar o próprio workflow também roda tudo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      docker: ${{ steps.f.outputs.docker }}
      scripts: ${{ steps.f.outputs.scripts }}
      audit: ${{ steps.f.outputs.audit }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - id: f
      env:
        EVENT: ${{ github.event_name }}
      run: |
        everything=false
        files=""
        if [ "$EVENT" != "pull_request" ]; then
          everything=true
        else
          files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$files" | grep -q '^\.github/workflows/' && everything=true
        fi
        check() { # check REGEX: true se tudo roda ou algum arquivo alterado casa
          if [ "$everything" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; then echo true; else echo false; fi
        }
        {
          echo "backend=$(check '^backend/')"
          echo "frontend=$(check '^frontend/')"
          echo "docker=$(check '^(backend|nginx|frontend)/|^docker-compose')"
          echo "scripts=$(check '^scripts/')"
          echo "audit=$(check '(uv\.lock|package-lock\.json)$')"
        } >> "$GITHUB_OUTPUT"
        echo "Arquivos alterados:"; printf '%s\n' "$files"; cat "$GITHUB_OUTPUT"

  # Testes rápidos (SQLite em memória) + migrations em banco vazio. O nome do job é mantido.
  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      working-directory: ./backend
      run: uv sync --frozen

    - name: Lint (ruff)
      working-directory: ./backend
      run: uv run ruff check app tests alembic

    - name: Migrations apply on an empty database
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gti_ci
        SECRET_KEY: ${{ env.CI_SECRET_KEY }}
        APP_ENCRYPTION_KEY: ${{ env.CI_ENCRYPTION_KEY }}
      run: uv run alembic upgrade head

    # A suíte em PostgreSQL (job abaixo) inclui estes mesmos testes e mais os de `pg`/`migrations`; rodar as duas
    # em todo PR dobrava os minutos. A versão em SQLite fica na execução semanal e sob demanda.
    - name: Run pytest (SQLite; só na execução semanal/manual)
      if: github.event_name != 'pull_request'
      working-directory: ./backend
      run: uv run pytest

  # Mesma suíte contra PostgreSQL 16 de verdade (inclui os testes marcados `pg` e `migrations`)
  # e verificação de que os models batem com as migrations.
  backend-postgres:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          # O guarda dos testes (tests/_guard.py) só aceita banco descartável: o nome termina em `_test`.
          POSTGRES_DB: gti_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gti_ci_test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      working-directory: ./backend
      run: uv sync --frozen

    - name: Migrations apply on an empty database
      working-directory: ./backend
      env:
        DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        SECRET_KEY: ${{ env.CI_SECRET_KEY }}
        APP_ENCRYPTION_KEY: ${{ env.CI_ENCRYPTION_KEY }}
      run: uv run alembic upgrade head

    - name: Models match migrations (alembic check)
      working-directory: ./backend
      env:
        DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        SECRET_KEY: ${{ env.CI_SECRET_KEY }}
        APP_ENCRYPTION_KEY: ${{ env.CI_ENCRYPTION_KEY }}
      run: uv run alembic check

    - name: Run pytest against PostgreSQL
      working-directory: ./backend
      run: uv run pytest

  # As imagens que vão para produção precisam construir (sem publicar).
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build backend image
      run: docker build -t gti-backend:ci ./backend

    - name: Build nginx image (compila o frontend Angular)
      run: docker build -f nginx/Dockerfile -t gti-nginx:ci .

  # Scripts de operação (instalação, backup, restauração) são código que mexe em dados: precisam passar no shellcheck.
  shellcheck:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: shellcheck
      run: shellcheck scripts/*.sh

  # Informativo: não reprova o PR, mas deixa o relatório de vulnerabilidades conhecidas no log.
  dependency-audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

    # Erro de infraestrutura (rede, ferramenta, lock quebrado) reprova o job. O pip-audit devolve 1 tanto para
    # "achou vulnerabilidades" quanto para erro; por isso o código 1 só é aceito se o relatório JSON foi gerado
    # e é válido (aí é achado, e o job é apenas informativo).
    - name: Python dependencies (pip-audit)
      working-directory: ./backend
      run: |
        uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
        rc=0
        uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip           -f json -o "$RUNNER_TEMP/pip-audit.json" || rc=$?
        if [ "$rc" -ne 0 ]; then
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/pip-audit.json" 2>/dev/null             || { echo "::error::pip-audit falhou sem gerar relatório (código $rc)"; exit "$rc"; }
          echo "::warning::pip-audit encontrou vulnerabilidades conhecidas (informativo)"
        fi
        python3 - "$RUNNER_TEMP/pip-audit.json" <<'PY'
        import json, sys
        for dep in json.load(open(sys.argv[1]))["dependencies"]:
            for vuln in dep.get("vulns", []):
                print(f"{dep['name']} {dep['version']}: {vuln['id']} (correção: {', '.join(vuln.get('fix_versions') or ['sem versão corrigida'])})")
        PY

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.x'

    - name: Frontend dependencies (npm audit)
      working-directory: ./frontend
      continue-on-error: true
      run: npm audit --omit=dev --audit-level=high

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint (erros bloqueiam; avisos são dívida registrada)
      working-directory: ./frontend
      run: npm run lint -- --quiet

    - name: Run tests
      working-directory: ./frontend
      run: npm run test -- --watch=false

    - name: Build
      working-directory: ./frontend
      run: npm run build
