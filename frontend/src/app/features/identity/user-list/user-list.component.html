<div class="page-container">
  <div class="page-header">
    <div class="title-area">
      <h1>Usuários</h1>
      <p class="subtitle">Gerencie os acessos, credenciais e perfis de operadores do sistema</p>
    </div>
    <button mat-flat-button color="primary" class="add-btn" (click)="openDialog()">
      <mat-icon>add</mat-icon> Novo Usuário
    </button>
  </div>

  <app-load-state [loading]="isLoading" [error]="loadError" [empty]="dataSource.length === 0"
                  emptyText="Nenhum usuário cadastrado." (retry)="loadData()"></app-load-state>

  <div class="table-container" *ngIf="!isLoading && !loadError && dataSource.length > 0">
    <table mat-table [dataSource]="dataSource" class="modern-table">
      
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef> Perfis </th>
        <td mat-cell *matCellDef="let element">
          <span *ngFor="let role of element.roles; let last = last">
            {{role.name}}{{last ? '' : ', '}}
          </span>
          <span *ngIf="!element.roles || element.roles.length === 0" class="text-muted">-</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="admin">
        <th mat-header-cell *matHeaderCellDef> Admin Global </th>
        <td mat-cell *matCellDef="let element">
          <mat-icon *ngIf="element.is_admin" color="primary">check_circle</mat-icon>
          <mat-icon *ngIf="!element.is_admin" color="warn">cancel</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element">
          <span class="status-badge" [class.active]="element.is_active">
            {{element.is_active ? 'Ativo' : 'Inativo'}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="openDialog(element)" title="Editar Usuário">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="resetPassword(element.id)" title="Resetar Senha">
            <mat-icon>lock_reset</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(element.id)" title="Excluir/Inativar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
