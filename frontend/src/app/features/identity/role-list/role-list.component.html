<div class="page-container">
  <div class="page-header">
    <div class="title-area">
      <h1>Perfis (Roles)</h1>
      <p class="subtitle">Gerencie os perfis de acesso e conjuntos de permissões granulares</p>
    </div>
    <button mat-flat-button color="primary" class="add-btn" (click)="openDialog()">
      <mat-icon>add</mat-icon> Novo Perfil
    </button>
  </div>

  <app-load-state [loading]="isLoading" [error]="loadError" [empty]="dataSource.length === 0"
                  emptyText="Nenhum perfil cadastrado." (retry)="loadData()"></app-load-state>

  <div class="table-container" *ngIf="!isLoading && !loadError && dataSource.length > 0">
    <table mat-table [dataSource]="dataSource" class="modern-table">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>

      <ng-container matColumnDef="permissions">
        <th mat-header-cell *matHeaderCellDef> Permissões </th>
        <td mat-cell *matCellDef="let element">
          <span *ngFor="let perm of element.permissions; let last = last">
            {{perm.label || perm.code}}{{last ? '' : ', '}}
          </span>
          <span *ngIf="!element.permissions || element.permissions.length === 0" class="text-muted">-</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteRole(element.id)" [disabled]="element.name === 'Administrador'">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
