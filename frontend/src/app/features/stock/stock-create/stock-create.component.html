<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <button mat-icon-button class="back-btn" routerLink="/stock">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1>Cadastrar Novo Insumo</h1>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="premium-form">
      
      <h3>
        <mat-icon color="primary">inventory_2</mat-icon>
        Informações do Item
      </h3>

      <div class="row-fields">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="half-width">
          <mat-label>Nome do Insumo</mat-label>
          <input matInput formControlName="name" placeholder="Ex: Teclado USB">
          <mat-icon matPrefix>label</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="half-width">
          <mat-label>Unidade Física Base</mat-label>
          <mat-select formControlName="unit_id">
            <mat-option *ngFor="let u of units" [value]="u.id">{{ u.name }}</mat-option>
          </mat-select>
          <mat-icon matPrefix>business</mat-icon>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width mt-3">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="description">
        <mat-icon matPrefix>description</mat-icon>
      </mat-form-field>

      <div class="divider"></div>

      <h3>
        <mat-icon color="primary">straighten</mat-icon>
        Quantidades e Alertas
      </h3>

      <div class="row-fields">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="half-width">
          <mat-label>Quantidade Inicial</mat-label>
          <input matInput type="number" formControlName="initial_quantity">
          <mat-icon matPrefix>add_shopping_cart</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="half-width">
          <mat-label>Estoque Mínimo (Alerta)</mat-label>
          <input matInput type="number" formControlName="min_quantity">
          <mat-icon matPrefix>warning</mat-icon>
        </mat-form-field>
      </div>
      
      <div class="form-actions mt-4">
        <button mat-button type="button" routerLink="/stock">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          <mat-icon>save</mat-icon> Salvar Insumo
        </button>
      </div>

    </form>
  </div>
</div>
