<div class="page-container">
  <div class="page-header">
    <div class="title-area">
      <h1>Unidades</h1>
      <p class="subtitle">Gerencie as unidades e filiais da organização</p>
    </div>
    <button mat-flat-button color="primary" class="add-btn" (click)="openDialog()">
      <mat-icon>add</mat-icon> Nova Unidade
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="modern-table">
      
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let element"> {{element.code}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element">
          <span class="status-badge" [class.active]="element.is_active">
            {{element.is_active ? 'Ativo' : 'Inativo'}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUnit(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
