<div class="login-container">
  <mat-card class="login-card mat-elevation-z8">
    <mat-card-header>
      <div mat-card-avatar class="header-image">
        <img *ngIf="companyLogoUrl; else defaultIcon" [src]="companyLogoUrl" alt="Logomarca" class="company-logo" (error)="onLogoError()">
        <ng-template #defaultIcon><mat-icon color="primary">computer</mat-icon></ng-template>
      </div>
      <mat-card-title>{{ companyName }}</mat-card-title>
      <mat-card-subtitle>Acesse sua conta</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="exemplo@empresa.com.br" autocomplete="email">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.controls.email.hasError('required')">O e-mail é obrigatório</mat-error>
          <mat-error *ngIf="loginForm.controls.email.hasError('email')">E-mail inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <mat-icon matPrefix>lock</mat-icon>
          <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Ocultar senha'">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.controls.password.hasError('required')">A senha é obrigatória</mat-error>
        </mat-form-field>
        <p class="forgot-link" *ngIf="resetEnabled"><a routerLink="/forgot-password" data-testid="forgot-link">Esqueci minha senha</a></p>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading" class="login-button">
          <span *ngIf="!isLoading">Entrar</span>
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
